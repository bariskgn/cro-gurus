u003e\n\n  \u003cdialog id=\"payment-dialog\" aria-labelledby=\"payment-title\"\u003e\u003cdiv class=\"preview-label\"\u003eMockup preview\u003c/div\u003e\u003ch2 id=\"payment-title\"\u003eEXPRESS CHECKOUT\u003c/h2\u003e\u003cp\u003eThis button represents the existing Shop Pay option. Payments are not enabled in this preview.\u003c/p\u003e\u003cbutton class=\"close-dialog\" autofocus\u003eBack to product\u003c/button\u003e\u003c/dialog\u003e\n  \u003cdialog id=\"menu-dialog\" aria-labelledby=\"menu-title\"\u003e\u003ch2 id=\"menu-title\"\u003eSHOP GROOVZ\u003c/h2\u003e\u003cp\u003e\u003ca href=\"https://groovzaudio.com/collections/all\"\u003eShop all products\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://groovzaudio.com/collections/ear-buds\"\u003eEar buds\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://groovzaudio.com/collections/open-ear\"\u003eOpen ear\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://groovzaudio.com/collections/speakers\"\u003eSpeakers\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://groovzaudio.com/collections/accessories\"\u003eAccessories\u003c/a\u003e\u003c/p\u003e\u003cbutton class=\"close-dialog\" autofocus\u003eClose\u003c/button\u003e\u003c/dialog\u003e\n  \u003cscript\u003e\n/*\n  Standalone UI prototype; all cart actions below are local to this HTML file.\n  Pricing: 1 pair = 5999 cents; 2 pairs = 9900 cents; savings = 2098 cents.\n  Shipping assumption: $7 for a discounted subtotal \u003c= $100; free above $100.\n  Before launch, confirm the shipping threshold's discount basis in Shopify.\n  Production integration: the PDP offer adds two selected variant IDs in one\n  Shopify cart request. The post-ATC offer adds ONE additional selected variant,\n  because the first item has already been added. Await the initial add response\n  before displaying the offer. Render the returned cart's actual discounts and\n  totals; do not use this prototype's calculations as a production discount.\n  Shopify's automatic discount must be configured and verified separately,\n  including eligible variants, larger quantities, and discount combinations.\n*/\nconst $=id=\u003edocument.getElementById(id);\nconst swatches=[...document.querySelectorAll('.swatch')];\nconst variants=new Map(swatches.map(button=\u003e[button.dataset.color,{image:button.dataset.image,thumb:button.querySelector('img').src}]));\nconst mainImage=$('main-image');\nlet currentColor='Grey', cart=[], nextId=1, upsellSeen=false, pendingFirstId=null, upgradeBusy=false;\nconst SINGLE=5999, BUNDLE=9900, SAVING=SINGLE*2-BUNDLE;\nconst money=cents=\u003e'$'+(cents/100).toFixed(2);\nfunction imageFor(id,color){const image=$(id);image.src=variants.get(color).image;image.alt=color+' Open-Ear Plus headphones';}\nfunction selectColor(color){currentColor=color;$('color-name').textContent=color;$('bundle-first-color').value=color;mainImage.src=variants.get(color).image;mainImage.alt='Groovz Plus headphones in '+color;swatches.forEach(button=\u003ebutton.setAttribute('aria-pressed',String(button.dataset.color===color)));document.querySelectorAll('.thumb').forEach(button=\u003ebutton.setAttribute('aria-pressed','false'));}\nswatches.forEach(button=\u003ebutton.addEventListener('click',()=\u003eselectColor(button.dataset.color)));\n$('bundle-first-color').addEventListener('change',event=\u003eselectColor(event.target.value));\nfunction selectSecond(color){$('bundle-second-color').value=color;$('modal-second-color').value=color;imageFor('modal-second-image',color);}\n$('bundle-second-color').addEventListener('change',event=\u003eselectSecond(event.target.value));\n$('modal-second-color').addEventListener('change',event=\u003eselectSecond(event.target.value));\ndocument.querySelectorAll('.thumb').forEach(button=\u003ebutton.addEventListener('click',()=\u003e{document.querySelectorAll('.thumb').forEach(b=\u003eb.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');mainImage.src=button.dataset.image;mainImage.alt=button.dataset.alt;}));\nfunction addItem(color){const item={id:nextId++,color};cart.push(item);updateCount();return item;}\nfunction updateCount(){$('cart-count').textContent=cart.length?' ('+cart.length+')':'';}\nfunction openDialog(id){$(id).showModal();document.documentElement.classList.add('offer-open');}\nfunction closeDialog(id){$(id).close();if(!document.querySelector('dialog[open]'))document.documentElement.classList.remove('offer-open');}\nfunction showUpgrade(first){pendingFirstId=first.id;upsellSeen=true;upgradeBusy=false;$('accept-upgrade').disabled=false;$('modal-first-color').textContent=first.color;imageFor('modal-first-image',first.color);selectSecond($('bundle-second-color').value);openDialog('upgrade-dialog');}\n$('add-cart').addEventListener('click',()=\u003e{const first=addItem(currentColor);if(cart.length===1\u0026\u0026!upsellSeen)showUpgrade(first);else showCart();});\n$('add-bundle').addEventListener('click',()=\u003e{addItem($('bundle-first-color').value);addItem($('bundle-second-color').value);upsellSeen=true;showCart('Your 2-pair offer has been added.');});\n$('accept-upgrade').addEventListener('click',()=\u003e{if(upgradeBusy||!$('upgrade-dialog').open)return;upgradeBusy=true;$('accept-upgrade').disabled=true;if(cart.some(item=\u003eitem.id===pendingFirstId)\u0026\u0026cart.length===1)addItem($('modal-second-color').value);pendingFirstId=null;closeDialog('upgrade-dialog');showCart('Upgraded to 2 pairs. You saved $20.98.');});\nfunction declineUpgrade(){pendingFirstId=null;closeDialog('upgrade-dialog');showCart('Your original pair is in your cart.');}\n$('decline-upgrade').addEventListener('click',declineUpgrade);$('dismiss-upgrade').addEventListener('click',declineUpgrade);\n$('upgrade-dialog').addEventListener('cancel',event=\u003e{event.preventDefault();declineUpgrade();});\nfunction cartRow(label,value,className=''){const row=document.createElement('div');row.className='cart-summary '+className;const a=document.createElement('span'),b=document.createElement('span');a.textContent=label;b.textContent=value;row.append(a,b);return row;}\nfunction renderCart(message=''){\n  const content=$('cart-content');content.replaceChildren();\n  if(message){const status=document.createElement('p');status.className='cart-confirm';status.textContent='✓ '+message;status.setAttribute('role','status');content.append(status);}\n  if(!cart.length){const p=document.createElement('p');p.textContent='Your preview cart is empty.';content.append(p);return;}\n  const pairCount=Math.floor(cart.length/2), discountedUnits=pairCount*2;\n  cart.forEach((item,index)=\u003e{const row=document.createElement('div');row.className='cart-item';const img=document.createElement('img');img.src=variants.get(item.color).thumb;img.alt=item.color+' headphones';const info=document.createElement('div');info.className='cart-item-info';const title=document.createElement('b');title.textContent='Open-Ear Plus';const color=document.createElement('span');color.textContent=item.color+' · Qty 1';const remove=document.createElement('button');remove.className='remove-item';remove.textContent='Remove';remove.setAttribute('aria-label','Remove '+item.color+' pair '+(index+1));remove.addEventListener('click',()=\u003e{cart=cart.filter(entry=\u003eentry.id!==item.id);updateCount();renderCart();});info.append(title,color,document.createElement('br'),remove);const price=document.createElement('div');price.className='cart-item-price';if(index\u003cdiscountedUnits){const old=document.createElement('del');old.textContent=money(SINGLE);const now=document.createElement('strong');now.textContent=money(BUNDLE/2);price.append(old,now);}else price.textContent=money(SINGLE);row.append(img,info,price);content.append(row);});\n  const before=cart.length*SINGLE,discount=pairCount*SAVING,subtotal=before-discount,shipping=subtotal\u003e10000?0:700;\n  content.append(cartRow('Products before offer',money(before)));\n  if(discount)content.append(cartRow('Buy 2 for $99 · automatically applied','−'+money(discount),'discount'));\n  content.append(cartRow('Subtotal',money(subtotal)),cartRow('Standard US shipping',shipping?money(shipping):'FREE'),cartRow('Total before tax',money(subtotal+shipping),'total'));\n  const note=document.createElement('p');note.className='cart-note';note.textContent='Interactive mockup only. No real cart or payment is connected.';content.append(note);\n}\nfunction showCart(message=''){renderCart(message);if(!$('cart-dialog').open)openDialog('cart-dialog');}\n$('view-cart').addEventListener('click',()=\u003eshowCart());\n$('wishlist').addEventListener('click',event=\u003e{const button=event.currentTarget;const selected=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(selected));$('wish-label').textContent=selected?'ADDED TO WISHLIST':'ADD TO WISHLIST';button.querySelector('span').textContent=selected?'♥':'♡';});\n$('shop-pay').addEventListener('click',()=\u003eopenDialog('payment-dialog'));\ndocument.querySelector('.mobile-menu').addEventListener('click',()=\u003eopenDialog('menu-dialog'));\ndocument.querySelectorAll('.close-dialog').forEach(button=\u003ebutton.addEventListener('click',()=\u003ecloseDialog(button.closest('dialog').id)));\ndocument.querySelectorAll('dialog').forEach(dialog=\u003e{dialog.addEventListener('close',()=\u003e{if(!document.querySelector('dialog[open]'))document.documentElement.classList.remove('offer-open');});dialog.addEventListener('click',event=\u003e{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX\u003e=r.left\u0026\u0026event.clientX\u003c=r.right\u0026\u0026event.clientY\u003e=r.top\u0026\u0026event.clientY\u003c=r.bottom)return;if(dialog.id==='upgrade-dialog')declineUpgrade();else closeDialog(dialog.id);});});\n$('reset-demo').addEventListener('click',()=\u003e{document.querySelectorAll('dialog[open]').forEach(dialog=\u003edialog.close());cart=[];upsellSeen=false;pendingFirstId=null;upgradeBusy=false;nextId=1;updateCount();selectColor('Grey');selectSecond('Grey');$('add-cart').scrollIntoView({block:'center'});$('add-cart').focus({preventScroll:true});});\n\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"</script>
  <script>
    const frame=document.getElementById('prototype-frame');
    const stage=document.getElementById('preview-stage');
    const desktop=document.getElementById('desktop-view');
    const mobile=document.getElementById('mobile-view');
    let ready=false;
    function updateSize(){document.getElementById('preview-size').textContent=Math.round(frame.clientWidth)+' × '+Math.round(frame.clientHeight);}
    function setView(mode,focusBundle=true){
      stage.classList.toggle('mobile',mode==='mobile');
      desktop.setAttribute('aria-pressed',String(mode==='desktop'));
      mobile.setAttribute('aria-pressed',String(mode==='mobile'));
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        updateSize();
        // Resizing the same frame preserves colors, cart contents and open dialogs.
        // Keep the bundle module in view when switching between device sizes.
        if(ready&&focusBundle&&!frame.contentDocument.querySelector('dialog[open]')){
          const bundle=frame.contentDocument.getElementById('bundle-module');
          const atc=frame.contentDocument.getElementById('add-cart');
          if(bundle&&atc){const top=atc.getBoundingClientRect().top+frame.contentWindow.scrollY-24;frame.contentWindow.scrollTo({top,behavior:'instant'});}
        }
      }));
    }
    desktop.addEventListener('click',()=>setView('desktop'));
    mobile.addEventListener('click',()=>setView('mobile'));
    frame.addEventListener('load',()=>{ready=true;updateSize();});
    new ResizeObserver(updateSize).observe(frame);
    frame.srcdoc=JSON.parse(document.getElementById('prototype-source').textContent);
    setView(window.innerWidth<640?'mobile':'desktop',false);
  </script>
</body>
