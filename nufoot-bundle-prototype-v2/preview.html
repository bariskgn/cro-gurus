<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nufoot — Teklif prototipi</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#e7e7e7;color:#222}.toolbar{height:64px;padding:10px 22px;background:#fff;border-bottom:1px solid #d7d7d7;display:flex;align-items:center;justify-content:space-between;gap:16px}.title strong{font-size:15px;display:block}.title span{font-size:12px;color:#737373}.switch{display:flex;gap:3px;padding:4px;background:#f1f1f1;border-radius:7px}button{font:inherit;cursor:pointer;border:0;background:none;color:#666;padding:7px 15px;border-radius:4px}button[aria-pressed=true]{background:#fff;color:#111;box-shadow:0 1px 4px #0002}.stage{height:calc(100dvh - 64px);display:flex;justify-content:center;align-items:center;padding:18px}iframe{width:100%;height:100%;border:0;background:white;box-shadow:0 1px 12px #0001;transition:width .2s,border-radius .2s}.stage.mobile iframe{width:390px;max-width:100%;border:7px solid #222;border-radius:26px;height:min(844px,100%)}@media(max-width:600px){.toolbar{padding:10px 12px}.title span{display:none}.title strong{font-size:13px}button{padding:7px 10px}.stage{padding:0}.stage.mobile iframe{border:0;border-radius:0;width:100%}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style></head><body><header class="toolbar"><div class="title"><strong>Nufoot · PDP teklif prototipi</strong><span>4 çift $49.99 + ücretsiz kargo · Başlangıçta 1 çift seçili</span></div><div class="switch" role="group" aria-label="Ekran görünümü"><button id="desktop" aria-pressed="true">Masaüstü</button><button id="mobile" aria-pressed="false">Mobil</button></div></header><main class="stage" id="stage"><iframe src="index.html" title="Nufoot ürün sayfası prototipi"></iframe></main><script>for(const id of ['desktop','mobile'])document.getElementById(id).addEventListener('click',()=>{document.getElementById('stage').classList.toggle('mobile',id==='mobile');for(const key of ['desktop','mobile'])document.getElementById(key).setAttribute('aria-pressed',String(key===id));});</script></body></html>
